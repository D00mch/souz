name: CI-Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality-fast:
    name: Quality Fast
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Run fast quality gate
        shell: bash
        env:
          SOUZ_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOUZ_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gate_log="$RUNNER_TEMP/souz-gate.log"
          gate_report=build/reports/souz-quality/fast/gate-summary.md
          gate_json=build/reports/souz-quality/fast/gate-summary-v1.json

          rm -f "$gate_report" "$gate_json"

          set +e
          ./gradlew souzGateFast --console=plain --stacktrace >"$gate_log" 2>&1
          gate_status=$?
          set -e

          if [[ -f "$gate_report" ]]; then
            tee -a "$GITHUB_STEP_SUMMARY" < "$gate_report"
          else
            cat "$gate_log"
            echo "Souz fast quality report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$gate_status"

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: souz-quality-fast-${{ github.run_id }}
          path: build/reports/souz-quality/fast/**
          if-no-files-found: warn

      - name: Verify quality evidence
        if: always()
        shell: bash
        run: |
          missing=0
          for quality_report in \
            build/reports/souz-quality/fast/gate-summary-v1.json \
            build/reports/souz-quality/fast/gate-summary.md; do
            if [[ ! -f "$quality_report" ]]; then
              echo "Missing required quality report: $quality_report"
              missing=1
            fi
          done
          exit "$missing"

  quality-expensive:
    name: Quality Expensive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: quality/package-lock.json

      - name: Install pinned quality tools
        run: npm ci --prefix quality

      - name: Run duplication ratchet
        shell: bash
        env:
          SOUZ_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOUZ_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gate_log="$RUNNER_TEMP/souz-duplication.log"
          gate_report=build/reports/souz-quality/expensive/gate-summary.md
          gate_json=build/reports/souz-quality/expensive/gate-summary-v1.json

          rm -f "$gate_report" "$gate_json"

          set +e
          ./gradlew souzDuplicationCheck --console=plain --stacktrace >"$gate_log" 2>&1
          gate_status=$?
          set -e

          if [[ -f "$gate_report" ]]; then
            tee -a "$GITHUB_STEP_SUMMARY" < "$gate_report"
          else
            cat "$gate_log"
            echo "Souz expensive quality report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$gate_status"

      - name: Upload duplication reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: souz-quality-expensive-${{ github.run_id }}
          path: build/reports/souz-quality/expensive/**
          if-no-files-found: warn

      - name: Verify duplication evidence
        if: always()
        shell: bash
        run: |
          missing=0
          for quality_report in \
            build/reports/souz-quality/expensive/gate-summary-v1.json \
            build/reports/souz-quality/expensive/gate-summary.md; do
            if [[ ! -f "$quality_report" ]]; then
              echo "Missing required quality report: $quality_report"
              missing=1
            fi
          done
          exit "$missing"

  repowise-quality:
    name: RepoWise PR Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DO_NOT_TRACK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      REPOWISE_NO_SAVE_KEY: "1"
      REPOWISE_SKIP_EDITOR_SETUP: "1"
      SOUZ_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SOUZ_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: quality/repowise-requirements.txt

      - name: Install pinned RepoWise
        run: >-
          python -m pip install --disable-pip-version-check
          --requirement quality/repowise-requirements.txt

      - name: Test RepoWise quality ratchet
        run: python -m unittest quality.repowise_quality_gate_test

      - name: Prepare pull-request base checkout
        shell: bash
        run: |
          base_checkout="$RUNNER_TEMP/repowise-base"
          git worktree add --detach "$base_checkout" "$SOUZ_PR_BASE_SHA"
          echo "REPOWISE_BASE_CHECKOUT=$base_checkout" >> "$GITHUB_ENV"

      - name: Build deterministic RepoWise indexes
        run: |
          repowise init "$REPOWISE_BASE_CHECKOUT" --yes --no-prose --no-workspace
          repowise init . --yes --no-prose --no-workspace

      - name: Generate PR-focused RepoWise reports
        shell: bash
        run: |
          mkdir -p build/reports/repowise
          repowise risk "$SOUZ_PR_BASE_SHA..$SOUZ_PR_HEAD_SHA" \
            --path . --baseline 200 --format json \
            > build/reports/repowise/pr-risk.json
          repowise health "$REPOWISE_BASE_CHECKOUT" --no-workspace --format json \
            > build/reports/repowise/base-health.json
          repowise health . --no-workspace --format json \
            > build/reports/repowise/pr-health.json

      - name: Enforce RepoWise code quality
        shell: bash
        run: |
          quality_report=build/reports/repowise/quality-ratchet.md
          set +e
          python quality/repowise_quality_gate.py \
            --base build/reports/repowise/base-health.json \
            --head build/reports/repowise/pr-health.json \
            --risk build/reports/repowise/pr-risk.json \
            --markdown "$quality_report" \
            --base-sha "$SOUZ_PR_BASE_SHA" \
            --head-sha "$SOUZ_PR_HEAD_SHA"
          quality_status=$?
          set -e
          tee -a "$GITHUB_STEP_SUMMARY" < "$quality_report"
          exit "$quality_status"

      - name: Upload RepoWise report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: souz-repowise-pr-quality-${{ github.run_id }}
          path: build/reports/repowise/**
          if-no-files-found: warn

      - name: Verify RepoWise evidence
        if: always()
        shell: bash
        run: |
          missing=0
          for repowise_report in \
            build/reports/repowise/base-health.json \
            build/reports/repowise/pr-health.json \
            build/reports/repowise/pr-risk.json \
            build/reports/repowise/quality-ratchet.md; do
            if [[ ! -s "$repowise_report" ]]; then
              echo "Missing required RepoWise report: $repowise_report"
              missing=1
            fi
          done
          exit "$missing"

  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Assemble
        run: ./gradlew assemble --console=plain --stacktrace --no-parallel

      - name: Run test suite and publish coverage summary
        shell: bash
        run: |
          coverage_log="$RUNNER_TEMP/kover.log"
          coverage_baseline=quality/coverage-baseline.json
          ./gradlew test :sharedLogic:allTests :sharedUI:allTests \
            :koverXmlReport :koverHtmlReport koverLog -Psouz.coverage \
            --console=plain --stacktrace --no-parallel | tee "$coverage_log"

          coverage_marker_pattern='^SOUZ_KOVER_LINE_COVERAGE=[0-9]+([.][0-9]+)?%$'
          if [[ "$(grep -Ec "$coverage_marker_pattern" "$coverage_log")" -ne 1 ]]; then
            echo "Expected exactly one aggregate Kover coverage marker"
            exit 1
          fi
          coverage_marker="$(grep -E "$coverage_marker_pattern" "$coverage_log")"
          module_marker_pattern='^SOUZ_KOVER_MODULE_LINE_COVERAGE=(:[[:alnum:]_-]+)+=[0-9]+([.][0-9]+)?%$'
          module_markers="$(grep -E "$module_marker_pattern" "$coverage_log" || true)"
          if [[ -z "$module_markers" ]]; then
            echo "Expected Kover coverage markers for project modules"
            exit 1
          fi
          if ! jq -e '
            .schemaVersion == 1 and
            (.referenceCommitSha | test("^[0-9a-f]{40}$")) and
            (.aggregate | type == "number") and
            (.modules | type == "object") and
            ([.modules[] | type == "number"] | all)
          ' "$coverage_baseline" >/dev/null; then
            echo "Invalid coverage baseline: $coverage_baseline"
            exit 1
          fi

          coverage_delta() {
            awk -v current="${1%%%}" -v baseline="$2" 'BEGIN { printf "%+.4f pp", current - baseline }'
          }

          aggregate_coverage="${coverage_marker#SOUZ_KOVER_LINE_COVERAGE=}"
          aggregate_baseline="$(jq -r '.aggregate' "$coverage_baseline")"
          baseline_module_count="$(jq -r '.modules | length' "$coverage_baseline")"
          current_module_count="$(printf '%s\n' "$module_markers" | wc -l | tr -d ' ')"
          if [[ "$current_module_count" -ne "$baseline_module_count" ]]; then
            echo "Coverage module count $current_module_count does not match baseline $baseline_module_count"
            exit 1
          fi

          {
            printf '## JVM coverage\n\n'
            printf '| Module | Baseline | Current | Delta |\n| --- | ---: | ---: | ---: |\n'
            printf '| **Aggregate** | %s%% | %s | %s |\n' \
              "$aggregate_baseline" "$aggregate_coverage" \
              "$(coverage_delta "$aggregate_coverage" "$aggregate_baseline")"
            while IFS=$'\t' read -r module baseline; do
              matching_markers="$(
                printf '%s\n' "$module_markers" |
                  grep -F "SOUZ_KOVER_MODULE_LINE_COVERAGE=$module=" || true
              )"
              if [[ "$(printf '%s\n' "$matching_markers" | grep -c .)" -ne 1 ]]; then
                echo "Expected one Kover coverage marker for baseline module $module"
                exit 1
              fi
              coverage="${matching_markers##*=}"
              printf '| `%s` | %s%% | %s | %s |\n' \
                "$module" "$baseline" "$coverage" "$(coverage_delta "$coverage" "$baseline")"
            done < <(jq -r '.modules | to_entries[] | [.key, (.value | tostring)] | @tsv' "$coverage_baseline")
          } >> "$GITHUB_STEP_SUMMARY"
          grep -Fq "| **Aggregate** | $aggregate_baseline% | $aggregate_coverage |" "$GITHUB_STEP_SUMMARY"

      - name: Verify coverage reports
        shell: bash
        run: |
          missing=0
          for coverage_report in \
            build/reports/kover/report.xml \
            build/reports/kover/html/index.html; do
            if [[ ! -f "$coverage_report" ]]; then
              echo "Missing required coverage report: $coverage_report"
              missing=1
            fi
          done
          exit "$missing"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: souz-coverage-${{ github.run_id }}
          path: build/reports/kover/**
          if-no-files-found: warn
