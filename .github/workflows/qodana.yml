name: Qodana

on:
  workflow_call:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qodana-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    name: Qodana Community
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Run Qodana
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: >-
            --config quality/qodana.yaml
            --linter qodana-jvm-community
            --within-docker false
          pr-mode: true
          use-annotations: false
          post-pr-comment: false
          upload-result: true
          artifact-name: qodana-report-${{ github.run_id }}
          cache-default-branch-only: true

      - name: Verify Qodana report
        if: always()
        shell: bash
        run: |
          if [[ ! -s "$RUNNER_TEMP/qodana/results/qodana.sarif.json" ]]; then
            echo '### Qodana report missing' >> "$GITHUB_STEP_SUMMARY"
            echo 'Analysis did not produce a nonempty SARIF report. See the Qodana step logs.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
