name: Publish Plugin SDK

on:
  push:
    tags:
      - plugin-api-v*

permissions:
  contents: read

concurrency:
  group: publish-plugin-sdk
  cancel-in-progress: false

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read

    steps:
      - name: Require release approval protection
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/environments/plugin-sdk-release" \
            --jq 'any(.protection_rules[]?; .type == "required_reviewers" and .prevent_self_review == true and (.reviewers | length > 0))' \
            | grep -qx true; then
            echo 'Configure plugin-sdk-release with required reviewers and prevent self-review before releasing.' >&2
            exit 1
          fi

      - name: Checkout release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release provenance
        shell: bash
        run: |
          [[ "$GITHUB_REF" =~ ^refs/tags/plugin-api-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_commit="$(git rev-parse --verify "$GITHUB_REF^{commit}")"
          if [[ "$release_commit" != "$GITHUB_SHA" ]] || [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo 'The release tag and checkout must match the triggering commit.' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$release_commit" refs/remotes/origin/kmp; then
            echo 'The release commit must belong to the approved kmp branch history.' >&2
            exit 1
          fi

  publish:
    needs: verify-source
    environment: plugin-sdk-release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-disabled: true

      - name: Check SDK and stage publication
        run: ./gradlew :plugin-api:check :plugin-api:publishSdkPublicationToVerificationRepository --dependency-verification=strict --console=plain

      - name: Verify release tag matches SDK version
        id: sdk
        shell: bash
        run: |
          sdk_version="$(python -c 'import xml.etree.ElementTree as E; print(E.parse("plugin-api/build/publications/sdk/pom-default.xml").findtext("{http://maven.apache.org/POM/4.0.0}version"))')"
          if [[ ! "$sdk_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$GITHUB_REF_NAME" != "plugin-api-v$sdk_version" ]]; then
            echo 'The release tag must match the stable SDK version in plugin-api/build.gradle.kts.' >&2
            exit 1
          fi
          printf 'version=%s\n' "$sdk_version" >> "$GITHUB_OUTPUT"

      - name: Verify staged SDK in standalone Hello project
        env:
          SOUZ_PLUGIN_MAVEN_URL: file://${{ github.workspace }}/plugin-api/build/maven-repository
        run: bash scripts/verify-plugin-sdk.sh

      - name: Sign and publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        shell: bash
        run: |
          for secret_name in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword ORG_GRADLE_PROJECT_signingInMemoryKey; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing required publishing credential: $secret_name" >&2
              exit 1
            fi
          done
          ./gradlew :plugin-api:publishAndReleaseToMavenCentral -Psouz.signPluginSdk --dependency-verification=strict --no-daemon --console=plain

      - name: Wait for public artifact availability
        env:
          SDK_VERSION: ${{ steps.sdk.outputs.version }}
        shell: bash
        run: |
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            --retry 60 --retry-delay 30 --retry-max-time 1800 --retry-all-errors \
            --output "$RUNNER_TEMP/plugin-api.pom" \
            "https://repo.maven.apache.org/maven2/io/github/d00mch/plugin-api/$SDK_VERSION/plugin-api-$SDK_VERSION.pom"

      - name: Verify public SDK in standalone Hello project
        run: bash scripts/verify-plugin-sdk.sh
