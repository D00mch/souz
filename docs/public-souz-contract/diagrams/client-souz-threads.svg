<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Client как peer Souz: два Thread</title>
  <desc id="desc">Схема показывает клиентскую сторону слева и два Thread в Souz Cloud справа: поиск фильма и заказ продуктовой корзины по вчерашнему фильму.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .boundary { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .lane { stroke: #94a3b8; stroke-width: 2; }
      .actor { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .surface { fill: #f1f5f9; stroke: #475569; stroke-width: 2; }
      .thread { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .step { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
      .tool { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; }
      .terminal { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .arrow-blue { stroke: #2563eb; stroke-width: 2.2; fill: none; marker-end: url(#arrow-blue); }
      .arrow-green { stroke: #059669; stroke-width: 2.2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow-green); }
      .text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; font-size: 19px; }
      .small { font-size: 15px; fill: #475569; }
      .label { font-size: 16px; fill: #334155; }
      .title { font-size: 25px; font-weight: 700; fill: #0f172a; }
      .section { font-size: 21px; font-weight: 700; fill: #0f172a; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 16px; fill: #0f172a; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1400" height="920"/>
  <line class="lane" x1="420" y1="38" x2="420" y2="882"/>

  <text class="title" x="70" y="52">Client</text>
  <text class="small" x="70" y="78">клиентская сторона</text>

  <circle cx="170" cy="125" r="22" fill="none" stroke="#2563eb" stroke-width="3"/>
  <line x1="170" y1="147" x2="170" y2="205" stroke="#2563eb" stroke-width="3"/>
  <line x1="130" y1="168" x2="210" y2="168" stroke="#2563eb" stroke-width="3"/>
  <line x1="170" y1="205" x2="135" y2="252" stroke="#2563eb" stroke-width="3"/>
  <line x1="170" y1="205" x2="205" y2="252" stroke="#2563eb" stroke-width="3"/>
  <text class="text" x="103" y="292">Пользователь</text>
  <text class="small" x="105" y="317">голос или текст</text>

  <path class="arrow-blue" d="M 170 335 L 170 383"/>
  <rect class="actor" x="65" y="385" width="245" height="92" rx="10"/>
  <text class="section" x="136" y="424">CLIENT</text>
  <text class="small" x="91" y="451">backend или mobile_app</text>

  <path class="arrow-blue" d="M 170 477 L 170 533"/>
  <rect class="surface" x="47" y="535" width="286" height="92" rx="10"/>
  <text class="section" x="103" y="574">Поверхности</text>
  <text class="small" x="78" y="601">экран / TTS / медиа / магазин</text>

  <path class="arrow-blue" d="M 310 431 C 360 431 386 278 462 278"/>
  <text class="label" x="286" y="365">message.submit</text>
  <text class="small" x="286" y="389">text + thread</text>

  <rect class="boundary" x="462" y="38" width="876" height="844" rx="18"/>
  <text class="title" x="495" y="76">Souz Cloud</text>
  <text class="small" x="495" y="100">chat, user requests, threads, durable events, tool calls</text>

  <rect class="surface" x="525" y="124" width="750" height="66" rx="10"/>
  <text class="section" x="770" y="153">Chat / Thread Router</text>
  <text class="small" x="700" y="176">ack, requestId, threadId, seq events</text>

  <rect class="thread" x="525" y="222" width="750" height="276" rx="12"/>
  <text class="section" x="555" y="258">Thread 1: поиск фильма</text>
  <text class="small" x="555" y="282">примерно соответствует examples/happy-path.json</text>

  <rect class="step" x="560" y="306" width="685" height="42" rx="8"/>
  <text class="text" x="583" y="333">Request от пользователя: «Включи какой-нибудь интересный фильм»</text>
  <path class="arrow" d="M 902 348 L 902 369"/>
  <rect class="step" x="560" y="370" width="685" height="42" rx="8"/>
  <text class="text" x="583" y="397">Память: вкусовые предпочтения</text>
  <path class="arrow" d="M 902 412 L 902 433"/>
  <rect class="tool" x="560" y="434" width="330" height="42" rx="8"/>
  <text class="mono" x="583" y="461">tool.call user.ask</text>
  <rect class="tool" x="915" y="434" width="330" height="42" rx="8"/>
  <text class="mono" x="938" y="461">device.media.open</text>

  <path class="arrow" d="M 902 190 L 902 222"/>
  <path class="arrow" d="M 902 476 L 902 520"/>
  <rect class="terminal" x="718" y="520" width="365" height="42" rx="8"/>
  <text class="text" x="773" y="547">thread.completed: фильм открыт</text>

  <rect class="thread" x="525" y="610" width="750" height="236" rx="12"/>
  <text class="section" x="555" y="646">Thread 2: заказ продуктовой корзины</text>
  <text class="small" x="555" y="670">гипотеза: корзина на основе просмотренного вчера фильма</text>

  <rect class="step" x="560" y="694" width="685" height="42" rx="8"/>
  <text class="text" x="583" y="721">Request от пользователя: «Собери корзину по вчерашнему фильму»</text>
  <path class="arrow" d="M 902 736 L 902 758"/>
  <rect class="tool" x="560" y="760" width="155" height="42" rx="8"/>
  <text class="mono" x="578" y="787">history.search</text>
  <path class="arrow" d="M 715 781 L 730 781"/>
  <rect class="step" x="732" y="760" width="154" height="42" rx="8"/>
  <text class="text" x="789" y="787">меню</text>
  <path class="arrow" d="M 886 781 L 900 781"/>
  <rect class="tool" x="902" y="760" width="118" height="42" rx="8"/>
  <text class="mono" x="925" y="787">user.ask</text>
  <path class="arrow" d="M 1020 781 L 1034 781"/>
  <rect class="tool" x="1036" y="760" width="209" height="42" rx="8"/>
  <text class="mono" x="1054" y="787">magnit.cart.create</text>
  <path class="arrow" d="M 902 802 L 902 824"/>
  <rect class="terminal" x="724" y="824" width="355" height="42" rx="8"/>
  <text class="text" x="772" y="851">thread.completed: корзина готова</text>

  <path class="arrow-green" d="M 560 456 C 455 456 405 430 310 430"/>
  <path class="arrow-green" d="M 525 781 C 455 781 405 455 310 455"/>
  <text class="label" x="342" y="510">tool.call.started target=client</text>
  <text class="small" x="342" y="533">Client спрашивает пользователя, открывает медиа</text>
  <text class="small" x="342" y="556">или создаёт корзину через клиентскую поверхность</text>

  <path class="arrow-blue" d="M 310 455 C 410 610 455 781 525 781"/>
  <text class="label" x="347" y="745">tool.result</text>
  <text class="small" x="347" y="768">результат возвращается в активный threadId</text>
</svg>
