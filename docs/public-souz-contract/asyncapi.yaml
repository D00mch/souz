asyncapi: 3.0.0
info:
  title: Client-Souz WebSocket Protocol
  version: 1.0.0-draft
  description: Bidirectional protocol for all interaction after a chat is created. The application described here is Souz.
servers:
  production:
    host: souz.example.ru
    protocol: wss
channels:
  chat:
    address: /v1/chats/{chatId}/ws
    parameters:
      chatId:
        description: Souz chat UUID whose event sequence is replayed.
    bindings:
      ws:
        headers:
          oneOf:
            - $ref: "#/components/schemas/BackendClientWsHeaders"
            - $ref: "#/components/schemas/MobileAppWsHeaders"
        query:
          type: object
          additionalProperties: false
          required: [clientType]
          properties:
            clientType:
              $ref: "./schemas/common.yaml#/components/schemas/ClientType"
            afterSeq:
              type: integer
              format: int64
              minimum: 0
operations:
  sendServerFrames:
    action: send
    channel:
      $ref: "#/channels/chat"
    summary: Send durable thread lifecycle events and acknowledgements for message submissions, tool results, and thread cancellation.
    messages:
      - $ref: "#/components/messages/SouzServerEvent"
      - $ref: "#/components/messages/SouzAck"
  receiveClientMessages:
    action: receive
    channel:
      $ref: "#/channels/chat"
    summary: Receive message submissions, tool results, and thread cancellation.
    messages:
      - $ref: "#/components/messages/ClientMessage"
components:
  schemas:
    BackendClientWsHeaders:
      type: object
      additionalProperties: false
      required: [X-Souz-Proxy-Auth, X-User-Id]
      properties:
        X-Souz-Proxy-Auth:
          type: string
        X-User-Id:
          type: string
          description: Authoritative Souz user ID for backend clients.
    MobileAppWsHeaders:
      type: object
      additionalProperties: false
      required: [Authorization]
      properties:
        Authorization:
          type: string
          description: Mobile application auth token.
  messages:
    SouzServerEvent:
      name: SouzServerEvent
      title: Souz event
      payload:
        $ref: "./schemas/events.yaml#/components/schemas/SouzServerEvent"
    ClientMessage:
      name: ClientMessage
      title: Client message
      payload:
        $ref: "./schemas/client-messages.yaml#/components/schemas/ClientMessage"
    SouzAck:
      name: SouzAck
      title: Message, tool-result, or thread-cancellation acknowledgement
      payload:
        $ref: "./schemas/client-messages.yaml#/components/schemas/SouzAck"
