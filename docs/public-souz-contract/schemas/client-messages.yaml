components:
  schemas:
    ClientMessage:
      oneOf:
        - $ref: "#/components/schemas/MessageSubmit"
        - $ref: "#/components/schemas/ToolResult"
        - $ref: "#/components/schemas/ThreadCancel"
    MessageSubmit:
      type: object
      additionalProperties: false
      required: [kind, chatId, requestId, payload]
      properties:
        kind:
          type: string
          enum: [message.submit]
        chatId:
          $ref: "./common.yaml#/components/schemas/UUID"
        requestId:
          $ref: "./common.yaml#/components/schemas/NonEmptyString"
          description: Client-generated idempotency key for this submission.
        threadId:
          anyOf:
            - $ref: "./common.yaml#/components/schemas/UUID"
            - type: "null"
          description: Omitted or null for the first submission; set to continue an active thread.
        payload:
          $ref: "#/components/schemas/MessageSubmitPayload"
    MessageSubmitPayload:
      type: object
      additionalProperties: false
      required: [device, content]
      properties:
        device:
          $ref: "./common.yaml#/components/schemas/Device"
        content:
          $ref: "#/components/schemas/RecognizedTextContent"
        meta:
          $ref: "#/components/schemas/RequestMeta"
    RecognizedTextContent:
      type: object
      additionalProperties: false
      required: [type, source, text]
      properties:
        type:
          type: string
          enum: [text]
        source:
          type: string
          enum: [voice, text]
          description: Input channel used to adapt the agent response.
        text:
          $ref: "./common.yaml#/components/schemas/NonEmptyString"
    RequestMeta:
      type: object
      additionalProperties: false
      properties:
        locale:
          type: string
        timeZone:
          type: string
        model:
          type: string
    ToolResult:
      oneOf:
        - $ref: "#/components/schemas/SucceededToolResult"
        - $ref: "#/components/schemas/FailedToolResult"
        - $ref: "#/components/schemas/CancelledToolResult"
        - $ref: "#/components/schemas/TimedOutToolResult"
    SucceededToolResult:
      type: object
      additionalProperties: false
      required: [kind, chatId, threadId, toolCallId, status, result]
      properties:
        kind:
          type: string
          enum: [tool.result]
        chatId:
          $ref: "./common.yaml#/components/schemas/UUID"
        threadId:
          $ref: "./common.yaml#/components/schemas/UUID"
        toolCallId:
          $ref: "./common.yaml#/components/schemas/NonEmptyString"
        status:
          type: string
          enum: [succeeded]
        result:
          $ref: "./common.yaml#/components/schemas/ArbitraryJson"
    FailedToolResult:
      type: object
      additionalProperties: false
      required: [kind, chatId, threadId, toolCallId, status, error]
      properties:
        kind:
          type: string
          enum: [tool.result]
        chatId:
          $ref: "./common.yaml#/components/schemas/UUID"
        threadId:
          $ref: "./common.yaml#/components/schemas/UUID"
        toolCallId:
          $ref: "./common.yaml#/components/schemas/NonEmptyString"
        status:
          type: string
          enum: [failed]
        error:
          $ref: "./common.yaml#/components/schemas/Error"
    CancelledToolResult:
      type: object
      additionalProperties: false
      required: [kind, chatId, threadId, toolCallId, status, error]
      properties:
        kind:
          type: string
          enum: [tool.result]
        chatId:
          $ref: "./common.yaml#/components/schemas/UUID"
        threadId:
          $ref: "./common.yaml#/components/schemas/UUID"
        toolCallId:
          $ref: "./common.yaml#/components/schemas/NonEmptyString"
        status:
          type: string
          enum: [cancelled]
        error:
          $ref: "./common.yaml#/components/schemas/Error"
    TimedOutToolResult:
      type: object
      additionalProperties: false
      required: [kind, chatId, threadId, toolCallId, status, error]
      properties:
        kind:
          type: string
          enum: [tool.result]
        chatId:
          $ref: "./common.yaml#/components/schemas/UUID"
        threadId:
          $ref: "./common.yaml#/components/schemas/UUID"
        toolCallId:
          $ref: "./common.yaml#/components/schemas/NonEmptyString"
        status:
          type: string
          enum: [timed_out]
        error:
          $ref: "./common.yaml#/components/schemas/Error"
    ThreadCancel:
      type: object
      additionalProperties: false
      required: [kind, chatId, requestId, threadId]
      properties:
        kind:
          type: string
          enum: [thread.cancel]
        chatId:
          $ref: "./common.yaml#/components/schemas/UUID"
        requestId:
          $ref: "./common.yaml#/components/schemas/NonEmptyString"
          description: Client-generated idempotency key for this cancellation request.
        threadId:
          $ref: "./common.yaml#/components/schemas/UUID"
        reason:
          type: string
          enum: [user_requested, superseded, device_disconnected]
    SouzAck:
      description: Acknowledgement for message submission, tool result, or thread cancellation.
      oneOf:
        - $ref: "#/components/schemas/MessageSubmitAck"
        - $ref: "#/components/schemas/ToolResultAck"
        - $ref: "#/components/schemas/ThreadCancelAck"
    MessageSubmitAck:
      oneOf:
        - $ref: "#/components/schemas/AcceptedMessageSubmitAck"
        - $ref: "#/components/schemas/RejectedMessageSubmitAck"
    AcceptedMessageSubmitAck:
      type: object
      additionalProperties: false
      required: [kind, chatId, requestId, status, duplicate, submission, thread, error, receivedAt]
      properties:
        kind:
          type: string
          enum: [ack]
        chatId:
          $ref: "./common.yaml#/components/schemas/UUID"
        requestId:
          $ref: "./common.yaml#/components/schemas/NonEmptyString"
        status:
          type: string
          enum: [accepted]
        duplicate:
          type: boolean
        submission:
          $ref: "#/components/schemas/AcknowledgedSubmission"
        thread:
          $ref: "#/components/schemas/AcknowledgedThread"
        error:
          type: "null"
        receivedAt:
          $ref: "./common.yaml#/components/schemas/DateTime"
    RejectedMessageSubmitAck:
      type: object
      additionalProperties: false
      required: [kind, chatId, requestId, status, duplicate, thread, error, receivedAt]
      properties:
        kind:
          type: string
          enum: [ack]
        chatId:
          $ref: "./common.yaml#/components/schemas/UUID"
        requestId:
          $ref: "./common.yaml#/components/schemas/NonEmptyString"
        status:
          type: string
          enum: [rejected]
        duplicate:
          type: boolean
        thread:
          type: "null"
        error:
          $ref: "./common.yaml#/components/schemas/Error"
        receivedAt:
          $ref: "./common.yaml#/components/schemas/DateTime"
    AcknowledgedSubmission:
      type: object
      additionalProperties: false
      required: [inputSeq]
      properties:
        inputSeq:
          type: integer
          format: int64
          minimum: 1
          description: Thread-local input sequence assigned to the accepted user submission.
    AcknowledgedThread:
      type: object
      additionalProperties: false
      required: [id, created, status, revision]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/UUID"
        created:
          type: boolean
        status:
          type: string
          enum: [running]
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Latest accepted input sequence for this thread after the acknowledgement.
    ToolResultAck:
      oneOf:
        - $ref: "#/components/schemas/AcceptedToolResultAck"
        - $ref: "#/components/schemas/RejectedToolResultAck"
    AcceptedToolResultAck:
      type: object
      additionalProperties: false
      required: [kind, chatId, toolCallId, threadId, status, duplicate, error, receivedAt]
      properties:
        kind:
          type: string
          enum: [ack]
        chatId:
          $ref: "./common.yaml#/components/schemas/UUID"
        toolCallId:
          $ref: "./common.yaml#/components/schemas/NonEmptyString"
        threadId:
          $ref: "./common.yaml#/components/schemas/UUID"
        status:
          type: string
          enum: [accepted]
        duplicate:
          type: boolean
        error:
          type: "null"
        receivedAt:
          $ref: "./common.yaml#/components/schemas/DateTime"
    RejectedToolResultAck:
      type: object
      additionalProperties: false
      required: [kind, chatId, toolCallId, threadId, status, duplicate, error, receivedAt]
      properties:
        kind:
          type: string
          enum: [ack]
        chatId:
          $ref: "./common.yaml#/components/schemas/UUID"
        toolCallId:
          $ref: "./common.yaml#/components/schemas/NonEmptyString"
        threadId:
          $ref: "./common.yaml#/components/schemas/UUID"
        status:
          type: string
          enum: [rejected]
        duplicate:
          type: boolean
        error:
          $ref: "./common.yaml#/components/schemas/Error"
        receivedAt:
          $ref: "./common.yaml#/components/schemas/DateTime"
    ThreadCancelAck:
      oneOf:
        - $ref: "#/components/schemas/AcceptedThreadCancelAck"
        - $ref: "#/components/schemas/RejectedThreadCancelAck"
    AcceptedThreadCancelAck:
      type: object
      additionalProperties: false
      required: [kind, chatId, requestId, threadId, status, duplicate, error, receivedAt]
      properties:
        kind:
          type: string
          enum: [ack]
        chatId:
          $ref: "./common.yaml#/components/schemas/UUID"
        requestId:
          $ref: "./common.yaml#/components/schemas/NonEmptyString"
        threadId:
          $ref: "./common.yaml#/components/schemas/UUID"
        status:
          type: string
          enum: [accepted]
        duplicate:
          type: boolean
        error:
          type: "null"
        receivedAt:
          $ref: "./common.yaml#/components/schemas/DateTime"
    RejectedThreadCancelAck:
      type: object
      additionalProperties: false
      required: [kind, chatId, requestId, threadId, status, duplicate, error, receivedAt]
      properties:
        kind:
          type: string
          enum: [ack]
        chatId:
          $ref: "./common.yaml#/components/schemas/UUID"
        requestId:
          $ref: "./common.yaml#/components/schemas/NonEmptyString"
        threadId:
          $ref: "./common.yaml#/components/schemas/UUID"
        status:
          type: string
          enum: [rejected]
        duplicate:
          type: boolean
        error:
          $ref: "./common.yaml#/components/schemas/Error"
        receivedAt:
          $ref: "./common.yaml#/components/schemas/DateTime"
