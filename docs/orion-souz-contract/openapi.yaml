openapi: 3.1.0
info:
  title: Orion-Souz REST API
  version: 1.0.0-draft
  description: REST contract for Orion to open chats, submit recognized text, replay events, answer options, and cancel executions.
servers:
  - url: https://souz.example.ru
security:
  - souzProxyAuth: []
    souzUserIdentity: []
paths:
  /v1/chats:
    post:
      operationId: openOrResumeOrionChat
      tags: [Orion Chats]
      summary: Open or resume an Orion session
      description: Opens the Souz chat associated with an Orion session for the trusted user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenOrionSessionRequest"
      responses:
        "200":
          description: Existing session resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenOrionSessionResponse"
        "201":
          description: New session opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenOrionSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/chats/{chatId}/messages:
    post:
      operationId: submitOrionUtterance
      tags: [Orion Messages]
      summary: Submit recognized user text
      description: Persists the user utterance and starts an agent execution.
      parameters:
        - $ref: "#/components/parameters/ChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitOrionUtteranceRequest"
      responses:
        "202":
          description: Execution accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitOrionUtteranceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/chats/{chatId}/events:
    get:
      operationId: replayOrionChatEvents
      tags: [Orion Events]
      summary: Replay durable chat events
      parameters:
        - $ref: "#/components/parameters/ChatId"
        - name: afterSeq
          in: query
          required: false
          description: Return durable events with seq greater than this value.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Durable events in sequence order.
          content:
            application/json:
              schema:
                $ref: "./schemas/events.yaml#/components/schemas/EventReplayResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/chats/{chatId}/executions/{executionId}/cancel:
    post:
      operationId: cancelOrionExecution
      tags: [Orion Executions]
      summary: Request execution cancellation
      parameters:
        - $ref: "#/components/parameters/ChatId"
        - $ref: "#/components/parameters/ExecutionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelExecutionRequest"
      responses:
        "200":
          description: Current execution state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelExecutionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/options/{optionId}/answer:
    post:
      operationId: answerOrionOption
      tags: [Orion Options]
      summary: Answer a user option through REST
      description: REST fallback for Orion user permission or choice responses.
      parameters:
        - $ref: "#/components/parameters/OptionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerOptionRequest"
      responses:
        "200":
          description: Option answered and execution resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerOptionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    souzProxyAuth:
      type: apiKey
      in: header
      name: X-Souz-Proxy-Auth
    souzUserIdentity:
      type: apiKey
      in: header
      name: X-User-Id
      description: Authoritative Souz user ID; for Orion this is the validated SberID.UUID.
  parameters:
    ChatId:
      name: chatId
      in: path
      required: true
      schema:
        $ref: "./schemas/common.yaml#/components/schemas/UUID"
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema:
        $ref: "./schemas/common.yaml#/components/schemas/UUID"
    OptionId:
      name: optionId
      in: path
      required: true
      schema:
        $ref: "./schemas/common.yaml#/components/schemas/UUID"
  responses:
    BadRequest:
      description: Invalid request path, query, headers, content type, or JSON body.
      content:
        application/json:
          schema:
            $ref: "./schemas/common.yaml#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Trusted proxy authentication or user identity is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "./schemas/common.yaml#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "./schemas/common.yaml#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Request conflicts with current session, idempotency, or execution state.
      content:
        application/json:
          schema:
            $ref: "./schemas/common.yaml#/components/schemas/ErrorEnvelope"
  schemas:
    OpenOrionSessionRequest:
      type: object
      additionalProperties: false
      required: [sessionId, device]
      properties:
        sessionId:
          $ref: "./schemas/common.yaml#/components/schemas/NonEmptyString"
        title:
          type: [string, "null"]
        device:
          $ref: "./schemas/common.yaml#/components/schemas/Device"
        voice:
          $ref: "./schemas/common.yaml#/components/schemas/VoiceIdentityHint"
        locale:
          type: string
          examples: [ru-RU]
        timeZone:
          type: string
          examples: [Europe/Moscow]
    OpenOrionSessionResponse:
      type: object
      additionalProperties: false
      required: [chat, sessionId, resumed]
      properties:
        chat:
          $ref: "./schemas/common.yaml#/components/schemas/Chat"
        sessionId:
          $ref: "./schemas/common.yaml#/components/schemas/NonEmptyString"
        resumed:
          type: boolean
        eventStream:
          $ref: "#/components/schemas/EventStreamInfo"
    SubmitOrionUtteranceRequest:
      type: object
      additionalProperties: false
      required: [requestId, sessionId, clientMessageId, device, content]
      properties:
        requestId:
          $ref: "./schemas/common.yaml#/components/schemas/NonEmptyString"
        sessionId:
          $ref: "./schemas/common.yaml#/components/schemas/NonEmptyString"
        clientMessageId:
          $ref: "./schemas/common.yaml#/components/schemas/NonEmptyString"
        device:
          $ref: "./schemas/common.yaml#/components/schemas/Device"
        voice:
          $ref: "./schemas/common.yaml#/components/schemas/VoiceIdentityHint"
        content:
          $ref: "#/components/schemas/RecognizedTextContent"
        options:
          $ref: "#/components/schemas/RequestOptions"
    RecognizedTextContent:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          type: string
          enum: [text]
        text:
          $ref: "./schemas/common.yaml#/components/schemas/NonEmptyString"
        asr:
          $ref: "#/components/schemas/AsrMetadata"
    AsrMetadata:
      type: object
      additionalProperties: false
      properties:
        provider:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        language:
          type: string
        completedAt:
          $ref: "./schemas/common.yaml#/components/schemas/DateTime"
    RequestOptions:
      type: object
      additionalProperties: false
      properties:
        locale:
          type: string
        timeZone:
          type: string
        model:
          type: string
        streamingMessages:
          type: boolean
    SubmitOrionUtteranceResponse:
      type: object
      additionalProperties: false
      required: [message, execution]
      properties:
        message:
          $ref: "./schemas/common.yaml#/components/schemas/Message"
        assistantMessage:
          anyOf:
            - $ref: "./schemas/common.yaml#/components/schemas/Message"
            - type: "null"
        execution:
          $ref: "./schemas/common.yaml#/components/schemas/Execution"
        eventStream:
          $ref: "#/components/schemas/EventStreamInfo"
    EventStreamInfo:
      type: object
      additionalProperties: false
      required: [webSocketUrl]
      properties:
        webSocketUrl:
          type: string
          format: uri
          examples: ["wss://souz.example.ru/v1/chats/0dbdf98e-2a6e-4667-a679-d0f795371641/ws"]
        afterSeq:
          type: integer
          format: int64
          minimum: 0
    CancelExecutionRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          enum: [user_requested, session_closed, superseded, device_disconnected]
    CancelExecutionResponse:
      type: object
      additionalProperties: false
      required: [execution]
      properties:
        execution:
          $ref: "./schemas/common.yaml#/components/schemas/Execution"
    AnswerOptionRequest:
      type: object
      additionalProperties: false
      required: [selectedOptionIds]
      properties:
        selectedOptionIds:
          type: array
          minItems: 1
          items:
            $ref: "./schemas/common.yaml#/components/schemas/NonEmptyString"
        freeText:
          type: [string, "null"]
        metadata:
          type: object
          additionalProperties:
            type: string
    AnswerOptionResponse:
      type: object
      additionalProperties: false
      required: [option, execution]
      properties:
        option:
          type: object
          additionalProperties: false
          required: [id, status]
          properties:
            id:
              $ref: "./schemas/common.yaml#/components/schemas/UUID"
            status:
              type: string
              enum: [answered]
        execution:
          $ref: "./schemas/common.yaml#/components/schemas/Execution"
