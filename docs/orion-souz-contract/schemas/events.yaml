components:
  schemas:
    SouzServerEvent:
      oneOf:
        - $ref: "#/components/schemas/EventEnvelope"
    EventReplayResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventEnvelope"
    EventEnvelope:
      type: object
      additionalProperties: false
      required: [kind, eventId, seq, durable, type, chatId, payload, createdAt]
      properties:
        kind:
          type: string
          enum: [event]
        eventId:
          $ref: "./common.yaml#/components/schemas/UUID"
        seq:
          type: [integer, "null"]
          format: int64
          minimum: 0
        durable:
          type: boolean
        type:
          $ref: "#/components/schemas/EventType"
        chatId:
          $ref: "./common.yaml#/components/schemas/UUID"
        sessionId:
          type: [string, "null"]
        requestId:
          type: [string, "null"]
        executionId:
          anyOf:
            - $ref: "./common.yaml#/components/schemas/UUID"
            - type: "null"
        payload:
          oneOf:
            - $ref: "#/components/schemas/MessageCreatedPayload"
            - $ref: "#/components/schemas/MessageDeltaPayload"
            - $ref: "#/components/schemas/MessageCompletedPayload"
            - $ref: "#/components/schemas/ExecutionStartedPayload"
            - $ref: "#/components/schemas/ExecutionFinishedPayload"
            - $ref: "#/components/schemas/ExecutionFailedPayload"
            - $ref: "#/components/schemas/ExecutionCancelledPayload"
            - $ref: "#/components/schemas/ToolCallStartedPayload"
            - $ref: "#/components/schemas/ToolCallFinishedPayload"
            - $ref: "#/components/schemas/ToolCallFailedPayload"
            - $ref: "#/components/schemas/OptionRequestedPayload"
            - $ref: "#/components/schemas/OptionAnsweredPayload"
            - $ref: "#/components/schemas/DeviceToolRequestedPayload"
        createdAt:
          $ref: "./common.yaml#/components/schemas/DateTime"
    EventType:
      type: string
      enum:
        - message.created
        - message.delta
        - message.completed
        - execution.started
        - execution.finished
        - execution.failed
        - execution.cancelled
        - tool.call.started
        - tool.call.finished
        - tool.call.failed
        - option.requested
        - option.answered
        - device.tool.requested
    MessageCreatedPayload:
      type: object
      additionalProperties: false
      required: [messageId, seq, role, content]
      properties:
        messageId:
          $ref: "./common.yaml#/components/schemas/UUID"
        seq:
          type: integer
          format: int64
          minimum: 1
        role:
          type: string
        content:
          type: string
        clientMessageId:
          type: [string, "null"]
    MessageDeltaPayload:
      type: object
      additionalProperties: false
      required: [messageId, delta]
      properties:
        messageId:
          $ref: "./common.yaml#/components/schemas/UUID"
        delta:
          type: string
    MessageCompletedPayload:
      type: object
      additionalProperties: false
      required: [messageId, seq, role, content]
      properties:
        messageId:
          $ref: "./common.yaml#/components/schemas/UUID"
        seq:
          type: integer
          format: int64
          minimum: 1
        role:
          type: string
        content:
          type: string
    ExecutionStartedPayload:
      type: object
      additionalProperties: false
      required: [executionId, streamingMessages]
      properties:
        executionId:
          $ref: "./common.yaml#/components/schemas/UUID"
        userMessageId:
          anyOf:
            - $ref: "./common.yaml#/components/schemas/UUID"
            - type: "null"
        model:
          type: [string, "null"]
        provider:
          type: [string, "null"]
        streamingMessages:
          type: boolean
    ExecutionFinishedPayload:
      type: object
      additionalProperties: false
      required: [executionId, status]
      properties:
        executionId:
          $ref: "./common.yaml#/components/schemas/UUID"
        assistantMessageId:
          anyOf:
            - $ref: "./common.yaml#/components/schemas/UUID"
            - type: "null"
        status:
          type: string
          enum: [completed]
        promptTokens:
          type: integer
          minimum: 0
        completionTokens:
          type: integer
          minimum: 0
        totalTokens:
          type: integer
          minimum: 0
        precachedTokens:
          type: integer
          minimum: 0
    ExecutionFailedPayload:
      type: object
      additionalProperties: false
      required: [executionId, errorCode, errorMessage]
      properties:
        executionId:
          $ref: "./common.yaml#/components/schemas/UUID"
        assistantMessageId:
          anyOf:
            - $ref: "./common.yaml#/components/schemas/UUID"
            - type: "null"
        errorCode:
          type: string
        errorMessage:
          type: string
    ExecutionCancelledPayload:
      type: object
      additionalProperties: false
      required: [executionId]
      properties:
        executionId:
          $ref: "./common.yaml#/components/schemas/UUID"
        assistantMessageId:
          anyOf:
            - $ref: "./common.yaml#/components/schemas/UUID"
            - type: "null"
    ToolCallStartedPayload:
      type: object
      additionalProperties: false
      required: [toolCallId, name, argumentKeys]
      properties:
        toolCallId:
          type: string
        name:
          type: string
        argumentKeys:
          type: array
          uniqueItems: true
          items:
            type: string
        argumentsPreview:
          $ref: "./common.yaml#/components/schemas/ArbitraryJson"
    ToolCallFinishedPayload:
      type: object
      additionalProperties: false
      required: [toolCallId, name, status]
      properties:
        toolCallId:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [finished]
        durationMs:
          type: integer
          minimum: 0
        resultPreview:
          $ref: "./common.yaml#/components/schemas/ArbitraryJson"
    ToolCallFailedPayload:
      type: object
      additionalProperties: false
      required: [toolCallId, name, status, error]
      properties:
        toolCallId:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [failed]
        error:
          type: string
        durationMs:
          type: integer
          minimum: 0
    OptionRequestedPayload:
      type: object
      additionalProperties: false
      required: [optionId, kind, title, selectionMode, options]
      properties:
        optionId:
          $ref: "./common.yaml#/components/schemas/UUID"
        kind:
          type: string
          examples: [permission]
        title:
          type: string
        selectionMode:
          type: string
          enum: [single, multiple]
        options:
          type: array
          items:
            $ref: "#/components/schemas/OptionItem"
    OptionItem:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
        content:
          type: [string, "null"]
    OptionAnsweredPayload:
      type: object
      additionalProperties: false
      required: [optionId, status, selectedOptionIds, metadata]
      properties:
        optionId:
          $ref: "./common.yaml#/components/schemas/UUID"
        status:
          type: string
          enum: [answered, expired, cancelled]
        selectedOptionIds:
          type: array
          items:
            type: string
        freeText:
          type: [string, "null"]
        metadata:
          type: object
          additionalProperties:
            type: string
    DeviceToolRequestedPayload:
      type: object
      additionalProperties: false
      required: [toolCallId, deviceId, toolName, arguments]
      properties:
        toolCallId:
          type: string
        deviceId:
          type: string
        toolName:
          type: string
          examples: [device.media.open]
        arguments:
          type: object
          additionalProperties: true
        deadlineAt:
          anyOf:
            - $ref: "./common.yaml#/components/schemas/DateTime"
            - type: "null"
