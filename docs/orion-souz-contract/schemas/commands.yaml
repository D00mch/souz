components:
  schemas:
    OrionCommand:
      type: object
      additionalProperties: false
      required: [kind, commandId, type, sessionId, chatId, payload]
      properties:
        kind:
          type: string
          enum: [command]
        commandId:
          $ref: "./common.yaml#/components/schemas/NonEmptyString"
        type:
          $ref: "#/components/schemas/CommandType"
        sessionId:
          $ref: "./common.yaml#/components/schemas/NonEmptyString"
        chatId:
          $ref: "./common.yaml#/components/schemas/UUID"
        requestId:
          type: [string, "null"]
        executionId:
          anyOf:
            - $ref: "./common.yaml#/components/schemas/UUID"
            - type: "null"
        payload:
          oneOf:
            - $ref: "#/components/schemas/DeviceToolResultPayload"
            - $ref: "#/components/schemas/OptionAnswerPayload"
            - $ref: "#/components/schemas/CancelRequestedPayload"
            - $ref: "#/components/schemas/PingPayload"
    CommandType:
      type: string
      enum:
        - device.tool.result
        - option.answer
        - execution.cancel_requested
        - ping
    DeviceToolResultPayload:
      type: object
      additionalProperties: false
      required: [toolCallId, status]
      properties:
        toolCallId:
          type: string
        status:
          type: string
          enum: [succeeded, failed, cancelled, timed_out]
        result:
          $ref: "./common.yaml#/components/schemas/ArbitraryJson"
        error:
          anyOf:
            - $ref: "./common.yaml#/components/schemas/Error"
            - type: "null"
    OptionAnswerPayload:
      type: object
      additionalProperties: false
      required: [optionId, selectedOptionIds]
      properties:
        optionId:
          $ref: "./common.yaml#/components/schemas/UUID"
        selectedOptionIds:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        freeText:
          type: [string, "null"]
        metadata:
          type: object
          additionalProperties:
            type: string
    CancelRequestedPayload:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          enum: [user_requested, session_closed, superseded, device_disconnected]
    PingPayload:
      type: object
      additionalProperties: false
      properties:
        sentAt:
          $ref: "./common.yaml#/components/schemas/DateTime"
    CommandAck:
      type: object
      additionalProperties: false
      required: [kind, commandId, status, duplicate, receivedAt]
      properties:
        kind:
          type: string
          enum: [ack]
        commandId:
          type: string
        status:
          type: string
          enum: [accepted, rejected]
        duplicate:
          type: boolean
        error:
          anyOf:
            - $ref: "./common.yaml#/components/schemas/Error"
            - type: "null"
        receivedAt:
          $ref: "./common.yaml#/components/schemas/DateTime"
