[versions]
awsSdk = "2.31.54"
commonmark = "0.30.0"
commonsCsv = "1.10.0"
cronUtils = "9.2.1"
jackson = "2.21.3"
junitJupiter = "6.0.2"
kodeinDi = "7.26.1"
kotlin = "2.4.10"
kover = "0.9.9"
kotlinx-coroutines = "1.11.0"
ktor = "3.5.1"
logback = "1.5.18"
log4j = "2.24.3"
mockk = "1.13.11"
slfj = "2.0.18"
tika = "3.2.3"
poi = "5.2.5"
jsoup = "1.18.3"
flyway = "10.20.1"
hikari = "5.1.0"
postgresql = "42.7.4"
re2j = "1.8"
testcontainers = "1.21.4"


[libraries]
jfreechart = { module = "org.jfree:jfreechart", version = "1.5.6" }
aws-s3 = { module = "software.amazon.awssdk:s3", version.ref = "awsSdk" }
aws-urlConnectionClient = { module = "software.amazon.awssdk:url-connection-client", version.ref = "awsSdk" }
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commons-csv = { module = "org.apache.commons:commons-csv", version.ref = "commonsCsv" }
cron-utils = { module = "com.cronutils:cron-utils", version.ref = "cronUtils" }
jackson = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junit-jupiterParams = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junitJupiter" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutinesSlf4j = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j", version.ref = "kotlinx-coroutines" }
kotlinx-coroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
ktor-clientCio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-clientOkhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-clientCore = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-clientContentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-clientLogging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-clientMock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-serializationJackson = { module = "io.ktor:ktor-serialization-jackson", version.ref = "ktor" }
ktor-serverSwagger = { module = "io.ktor:ktor-server-swagger", version.ref = "ktor" }
ktor-serverRoutingOpenapi = { module = "io.ktor:ktor-server-routing-openapi", version.ref = "ktor" }
ktor-openapiSchemaReflect = { module = "io.ktor:ktor-openapi-schema-reflect", version.ref = "ktor" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
log4j-to-slf4j = { module = "org.apache.logging.log4j:log4j-to-slf4j", version.ref = "log4j" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
slfj = { module = "org.slf4j:jul-to-slf4j", version.ref = "slfj" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slfj" }
slf4j-jcl = { module = "org.slf4j:jcl-over-slf4j", version.ref = "slfj" }
tika-core = { module = "org.apache.tika:tika-core", version.ref = "tika" }
tika-parsersStandardPackage = { module = "org.apache.tika:tika-parsers-standard-package", version.ref = "tika" }
poi = { module = "org.apache.poi:poi", version.ref = "poi" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
hikari-cp = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
postgresql-jdbc = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
re2j = { module = "com.google.re2j:re2j", version.ref = "re2j" }
testcontainers-junitJupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }

[bundles]
ktorClient = [
    "ktor-clientContentNegotiation",
    "ktor-clientCio",
    "ktor-clientCore",
    "ktor-clientLogging"
]
[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
